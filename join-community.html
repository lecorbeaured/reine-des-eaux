    body {
      font-family: 'Georgia', serif;
      color: #2c3e3f;
      margin: 0;
      padding: 0;
      min-height: 100vh;

      background-size: 400% 400%;
      animation: flow 8s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes flow {
      0%,100% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
    }
    .container {
      background: rgba(255,255,255,0.96);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 800px;
      padding: 2rem;
      margin: 2rem;
      text-align: center;
    }
    h1 { color: #0f4c3a; }
    p { margin-top: 1rem; }
    a { color: #3ca9a0; text-decoration: none; }
    a:hover { text-decoration: underline; }
/* Match Terms page back-link style */
a.back-link{
  display: inline-block;
  margin-top: 1.25rem;
  color: #3ca9a0;        /* same accent you use site-wide */
  text-decoration: none;
  font-weight: 600;      /* bolder look like Terms page */
}
a.back-link:hover{
  text-decoration: underline;
}

/* Floating emoji animation (missing before) */
.floating-element{
  position: absolute;          /* allow free placement on the page */
  font-size: 2rem;             /* make them visible */
  pointer-events: none;        /* clicks pass through */
  animation: float 6s ease-in-out infinite;  /* animate! */
  opacity: .6;
  z-index: 0;                  /* sit behind the white card */
}

/* The motion path */
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-20px) rotate(10deg); }
}

  </style>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
<script>
    // Add floating elements
    function createFloatingElements() {
      const symbols = ['🌊', '✨', '🔱', '🌙', '💎', '🐚', '🌺'];
      const container = document.body;
      
      for (let i = 0; i < 5; i++) {
        const element = document.createElement('div');
        element.className = 'floating-element';
        element.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        element.style.left = Math.random() * 100 + '%';
        element.style.top = Math.random() * 100 + '%';
        element.style.animationDelay = Math.random() * 6 + 's';
        container.appendChild(element);
      }
    }
    document.addEventListener('DOMContentLoaded', createFloatingElements);
  </script>

</body>
