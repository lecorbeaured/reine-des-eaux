<title>Contact Us | Mami Wata: A Journey to Self-Initiation</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
  .container { max-width: 700px; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; color: var(--teal-2); font-weight: 600; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 0.85rem; border: 1px solid #ddd; border-radius: 8px;
    font-family: inherit; font-size: 1rem; background: #fff;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    outline: 2px solid var(--teal-3); border-color: var(--teal-3);
  }
  .form-group textarea { min-height: 150px; resize: vertical; }
  .form-grid { display: grid; gap: 1rem; }
  @media (min-width: 500px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .contact-info {
    margin-top: 2rem; padding: 1.25rem; background: rgba(60, 169, 160, 0.1);
    border-radius: 12px;
  }
  .contact-info h3 { color: var(--deep); margin: 0 0 0.75rem; }
  .contact-info p { margin: 0.5rem 0; font-size: 0.95rem; }
  .contact-info a { color: var(--teal-3); }
  .vh { position: absolute; left: -9999px; }
  .back-link { text-align: center; width: 100%; }
</style>
</head>
<body>
  <div class="water-bg"></div>
  
  <div class="container">
    <h1>Contact Us</h1>
    <p class="subtitle">We're Here to Help</p>
    
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
      <p class="vh"><label>Don't fill this out: <input name="bot-field"></label></p>
      
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
      </div>
      
      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Select a subject...</option>
          <option value="technical">Technical Support</option>
          <option value="access">Access Issues</option>
          <option value="content">Content Questions</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" required placeholder="How can we help? Include your order email if relevant."></textarea>
      </div>
      
      <button type="submit" class="btn-primary" style="width: 100%;">Send Message 📬</button>
    </form>

    <div class="contact-info">
      <h3>Response Time</h3>
      <p>⏰ We respond to all messages within 24-48 hours.</p>
      <p>For refund questions, please review our <a href="refund-policy.html">refund policy</a> first.</p>
    </div>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    function createFloatingElements() {
      const symbols = ['🌊', '✨', '🔱', '🌙', '💎', '🐚', '🌺'];
      for (let i = 0; i < 5; i++) {
        const el = document.createElement('div');
        el.className = 'floating-element';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.top = Math.random() * 100 + '%';
        el.style.animationDelay = Math.random() * 6 + 's';
        document.body.appendChild(el);
      }
    }
    document.addEventListener('DOMContentLoaded', createFloatingElements);
    
    // Track form submission
    document.querySelector('form').addEventListener('submit', function() {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'contact_form_submit', {
          event_category: 'conversion',
          event_label: document.getElementById('subject').value
        });
      }
    });
  </script>
</body>
</html>
